security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator

            # Anti force brute : 5 essais ratés maximum par quart d'heure (par email et par IP).
            # Nécessite le paquet symfony/rate-limiter (composer require symfony/rate-limiter).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: app_logout
                target: app_home
                
                # Le lien de déconnexion doit contenir un jeton CSRF (généré par logout_path()).
                enable_csrf: true

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
